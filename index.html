<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFCON CMC BMK</title>
    <link rel="icon" type="image/png" href="fav.png">
    <style>
        /* Loading the specific font for the headline */
        @font-face {
            font-family: 'LIVE-Font';
            src: url('LIVE.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        /* Loading the specific font for the body text */
        @font-face {
            font-family: 'Erbar-Font';
            src: url('Erbar.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        /* Loading the specific font for the button labels */
        @font-face {
            font-family: 'AFCON-Font';
            src: url('AFCON.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        :root {
            --headline-font: 'LIVE-Font', 'CAF-Brand', 'Roboto', sans-serif;
            --body-font: 'Erbar-Font', 'Montserrat', sans-serif;
            --button-label-font: 'AFCON-Font', sans-serif;
            --afcon-red: #801416;
        }

        body {
            background-color: var(--afcon-red);
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Preventing scroll to keep the layout tight */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Logos Styling */
        .logo-header {
            display: flex;
            align-items: center;
            padding: 20px 40px;
            gap: 12px;
            z-index: 10;
        }

        .logo-item {
            height: 50px; 
            width: auto;
            object-fit: contain;
        }

        .logo-s {
            height: 40px; 
            width: auto;
            object-fit: contain;        
        }

        .logo-b {
            height: 53px; 
            width: auto;
            object-fit: contain;        
        }
            
        .logo-y {
            height: 41px; 
            width: auto;
            object-fit: contain;        
        }

        .separator {
            height: 25px; 
            width: auto;
            opacity: 0.8;
        }

        .hero-container {
            flex: 1;
            width: 100%;
            padding: 0 10%;
            display: flex;
            align-items: center;
            position: relative;
        }

        .content-box {
            position: relative;
            z-index: 5;
        }

        .headline {
            font-family: var(--headline-font);
            font-weight: normal;
            font-size: clamp(3.1rem, 4.1vw, 5rem); 
            line-height: 1.1;
            letter-spacing: -0.01em;
            word-spacing: -0.2rem;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            transform: translate(-90px, -120px); 
        }

        .divider {
            width: 75px; 
            height: 1px; 
            background-color: white;
            margin-top: 0.6rem;
            margin-bottom: 0.3rem; 
            transform: translate(-90px, -120px); 
        }

        .subtext {
            font-family: var(--body-font);
            font-weight: 400; 
            font-size: 1.4rem; 
            line-height: 1.2;
            max-width: 800px; 
            letter-spacing: 0.02em;
            word-spacing: -0.2rem;
            transform: translate(-90px, -125px); 
            margin-bottom: 2rem;
        }

        /* Button Group Containers */
        .btn-group-row {
            display: flex;
            gap: 130px; /* Spacing between buttons */
            position: relative;
        }

        .row-top {
            transform: translate(-90px, -70px);
        }

        .row-bottom {
            transform: translate(40px, -30px);
        }

        /* Image Button Styling */
        .image-btn-base {
            display: block;
            width: 180px; 
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            border: none;
            background: none;
            padding: 0;
            position: relative; /* Necessary for centering the label */
            /* GPU Acceleration hack for smoother hover */
            backface-visibility: hidden;
            /* FIX: Removes the default mobile tap rectangle/highlight */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        .image-btn-base {
    transition: transform 0.3s, filter 0.3s;
    cursor: pointer;
    }

   .image-btn-base:hover {
    transform: scale(1.1);
    filter: brightness(1.2) drop-shadow(0 0 8px #ffcc00) drop-shadow(0 0 15px #ffae00);
}

        /* Label Styling over btn.webp */
        .btn-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--button-label-font);
            color: white;
            font-size: 1.2rem;
            text-transform: uppercase;
            pointer-events: none; /* Allows click through to button */
            white-space: nowrap;
        }

        /* Right Side Hero Image (p1) */
        .p1-hero {
            position: absolute;
            right: 0;
            bottom: 0;
            height: 90vh; 
            width: auto;
            z-index: 1;
            pointer-events: none; 
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* ========================================= */
        /* MOBILE RESPONSIVE DESIGN (Max Width 1024px) */
        /* ========================================= */
        @media (max-width: 1024px) {
            body {
                overflow-y: auto; /* Allow scrolling vertically on small phones */
                overflow-x: hidden; /* Prevent horizontal scroll */
            }

            /* 1. Header: Logos side to side, small padding */
            .logo-header {
                flex-wrap: nowrap; /* Force single line */
                justify-content: space-between; /* Stretch from side to side */
                padding: 15px 10px; /* Small padding so it doesn't touch the side */
                gap: 0; 
                width: 100%;
                box-sizing: border-box;
                overflow-x: hidden; 
            }

            /* Use vw units so logos shrink as screen gets narrower */
            .logo-item, .logo-b, .logo-s, .logo-y { height: 8vw; width: auto; }
            .separator { height: 5vw; width: auto; }

            /* 2. Layout: Stack vertically, aligned left */
            .hero-container {
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-start; /* Start from left */
                padding: 20px; /* Equal padding right and left */
                height: auto;
            }

            .content-box {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: flex-start; /* Left align text and buttons */
                margin-top: 10px;
            }

            /* 3. Text: Left aligned, Single Line, Resizes with screen */
            .headline {
                transform: none !important; /* Reset position */
                white-space: nowrap; /* Force single line */
                text-align: left;
                font-size: 6.7vw; /* Reduced from 7vw to fit with max-width */
                margin-bottom: 10px;
                width: 100%;
                max-width: 85%; /* Don't touch right side */
            }

            .divider {
                transform: none !important;
                margin: 10px 0; /* Align left */
            }

            .subtext {
                transform: none !important;
                text-align: left;
                font-size: 1.1rem;
                margin-bottom: 30px;
                max-width: 90%; /* Constrain text width so it doesn't touch the right edge */
            }

            /* 4. Buttons: Mimic web appearance (staggered) */
            .btn-group-row {
                width: 100%;
                justify-content: flex-start; /* Start from left */
                gap: 50px; 
                margin-bottom: 35px; 
            }

            .row-top {
                /* Reduced version of desktop transform (shifted left) */
                transform: translate(-10px, 0) !important; 
            }
            .row-bottom {
                /* Shifted right and moved UP (from 25px to 10px) */
                transform: translate(30px, 10px) !important;
            }

            .image-btn-base {
                width: 35vw; 
                max-width: 160px;
            }
            
            .btn-label {
                font-size: 0.9rem;
            }

            /* 5. Image (p1): Moved up to Title level, More transparent */
            .p1-hero {
                position: absolute; /* Absolute relative to hero-container */
                top: 20px; /* Align with top (Title level) */
                right: -30%; 
                bottom: auto; /* Remove bottom anchor */
                height: 50vh; 
                opacity: 0.2; /* MORE TRANSPARENT */
                z-index: -1; 
                pointer-events: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header with Logos and bet.webp separators -->
    <header class="logo-header">
        <img src="caf.webp" alt="caf" class="logo-item">
        <img src="bet.webp" alt="" class="separator"> 
        <img src="cmc.webp" alt="cmc" class="logo-s">
        <img src="bet.webp" alt="" class="separator">
        <img src="dia.webp" alt="dia" class="logo-item">
        <img src="bet.webp" alt="" class="separator">
        <img src="AIG.webp" alt="AIG" class="logo-item">
        <img src="bet.webp" alt="" class="separator">
        <img src="arti.webp" alt="arti" class="logo-item">
        <img src="bet.webp" alt="" class="separator">
        <img src="fablab.webp" alt="fablab" class="logo-b">
        <img src="bet.webp" alt="" class="separator">
        <img src="y.webp" alt="y" class="logo-y">
    </header>

    <main class="hero-container">
        <!-- The big image on the max right -->
        <img src="p1.webp" alt="" class="p1-hero">

        <div class="content-box fade-in">
            <h1 class="headline">
                Live the AFCON Experience
            </h1>
            
            <div class="divider"></div>
            
            <p class="subtext">
                Celebrate the heartbeat of African football.
Interactive games, brainstormed in the FabLab and CoP at CMC BMK, highlight our institute’s
dedication to the spectacle our country knows.
            </p>

           <!-- Top Row: btn (Predict), btn2 (Quiz) -->
            <div class="btn-group-row row-top">
                <button class="image-btn-base" id="btn" onclick="window.location.href='predict/predict.html'">
                    <img src="btn.webp" alt="" style="width: 100%; height: auto;">
                    <span class="btn-label">Predict</span>
                </button>
                <button class="image-btn-base" id="btn2" onclick="window.location.href='quiz/quiz.html'">
                    <img src="btn.webp" alt="" style="width: 100%; height: auto;">
                    <span class="btn-label">Quiz</span>
                </button>
            </div>

            <!-- Bottom Row: btn1 (Card), btn4 (Memo) -->
            <div class="btn-group-row row-bottom">
                <button class="image-btn-base" id="btn1" onclick="document.getElementById('card-section').scrollIntoView({behavior: 'smooth'})">
                    <img src="btn.webp" alt="" style="width: 100%; height: auto;">
                    <span class="btn-label">Card</span>
                </button>
                
                <button class="image-btn-base" id="btn4" onclick="window.location.href='memo/memo.html'">
                    <img src="btn.webp" alt="" style="width: 100%; height: auto;">
                    <span class="btn-label">Memo</span>
                </button>
            </div>

        </div>
    </main>

</body>
</html>
