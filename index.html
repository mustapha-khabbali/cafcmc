<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFCON CMC BMK</title>
    <link rel="icon" type="image/png" href="fav.png">
    <style>
        /* Loading the specific font for the headline */
        @font-face {
            font-family: 'LIVE-Font';
            src: url('LIVE.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        /* Loading the specific font for the body text */
        @font-face {
            font-family: 'Erbar-Font';
            src: url('Erbar.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        /* Loading the specific font for the button labels */
        @font-face {
            font-family: 'AFCON-Font';
            src: url('AFCON.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        :root {
            --headline-font: 'LIVE-Font', 'CAF-Brand', 'Roboto', sans-serif;
            --body-font: 'Erbar-Font', 'Montserrat', sans-serif;
            --button-label-font: 'AFCON-Font', sans-serif;
            --afcon-red: #801416;
        }

        body {
            background-color: var(--afcon-red);
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Preventing scroll to keep the layout tight */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
          /* VISIBILITY LOGIC (FIXED) */
        .mobile-only { display: none !important; } /* Hidden by default on Desktop */


        /* Header Logos Styling */
        .logo-header {
            display: flex;
            align-items: center;
            padding: 20px 40px;
            gap: 12px;
            z-index: 10;
        }

        .logo-item {
            height: 50px; 
            width: auto;
            object-fit: contain;
        }

        .logo-s {
            height: 40px; 
            width: auto;
            object-fit: contain;        
        }

        .logo-b {
            height: 53px; 
            width: auto;
            object-fit: contain;        
        }
            
        .logo-y {
            height: 41px; 
            width: auto;
            object-fit: contain;        
        }

        .separator {
            height: 25px; 
            width: auto;
            opacity: 0.8;
        }

        .hero-container {
            flex: 1;
            width: 100%;
            padding: 0 10%;
            display: flex;
            align-items: center;
            position: relative;
        }

        .content-box {
            position: relative;
            z-index: 5;
        }

        .headline {
            font-family: var(--headline-font);
            font-weight: normal;
            font-size: clamp(3.1rem, 4.1vw, 5rem); 
            line-height: 1.1;
            letter-spacing: -0.01em;
            word-spacing: -0.2rem;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            transform: translate(-90px, -120px); 
        }

        .divider {
            width: 75px; 
            height: 1px; 
            background-color: white;
            margin-top: 0.6rem;
            margin-bottom: 0.3rem; 
            transform: translate(-90px, -120px); 
        }

        .subtext {
            font-family: var(--body-font);
            font-weight: 400; 
            font-size: 1.4rem; 
            line-height: 1.2;
            max-width: 800px; 
            letter-spacing: 0.02em;
            word-spacing: -0.2rem;
            transform: translate(-90px, -125px); 
            margin-bottom: 2rem;
        }

        /* Button Group Containers */
        .btn-group-row {
            display: flex;
            gap: 130px; /* Spacing between buttons */
            position: relative;
        }

        .row-top {
            transform: translate(-90px, -70px);
        }

        .row-bottom {
            transform: translate(40px, -30px);
        }

        /* Image Button Styling */
        .image-btn-base {
            display: block;
            width: 180px; 
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            border: none;
            background: none;
            padding: 0;
            position: relative; /* Necessary for centering the label */
            /* GPU Acceleration hack for smoother hover */
            backface-visibility: hidden;
            /* FIX: Removes the default mobile tap rectangle/highlight */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        .image-btn-base {
    transition: transform 0.3s, filter 0.3s;
    cursor: pointer;
    }

   .image-btn-base:hover {
    transform: scale(1.1);
    filter: brightness(1.2) drop-shadow(0 0 8px #ffcc00) drop-shadow(0 0 15px #ffae00);
}

        /* Label Styling over btn.webp */
        .btn-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--button-label-font);
            color: white;
            font-size: 1.2rem;
            text-transform: uppercase;
            pointer-events: none; /* Allows click through to button */
            white-space: nowrap;
        }

        /* Right Side Hero Image (p1) */
        .p1-hero {
            position: absolute;
            right: 0;
            bottom: 0;
            height: 90vh; 
            width: auto;
            z-index: 1;
            pointer-events: none; 
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        #video-modal {
    display: none; /* Hidden by default */
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.95);
    z-index: 1000;
    
    /* Perfect Centering Logic */
    display: none; 
    justify-content: center;
    align-items: center;
}

.modal-content {
    position: relative;
    width: 90%;          /* Responsive width on mobile */
    max-width: 800px;    /* Prevents it from being too huge on desktop */
    aspect-ratio: 16 / 9; /* Keeps the video shape consistent */
    display: flex;
    justify-content: center;
    align-items: center;
}

video {
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
}

.close-modal {
    position: absolute;
    top: -50px; /* Moves the 'X' above the video */
    right: 0;
    color: white;
    font-size: 3rem;
    cursor: pointer;
    font-family: sans-serif;
}

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }
.desktop-only .btn-group-row {
    display: flex;
    gap: 130px; 
    position: relative;
}
.desktop-only .row-top { transform: translate(-90px, -70px); }
.desktop-only .row-bottom { transform: translate(40px, -30px); }
        
        /* ========================================= */
        /* MOBILE RESPONSIVE DESIGN (Max Width 1024px) */
        /* ========================================= */
         /* MOBILE RESPONSIVE DESIGN */
        @media (max-width: 1024px) {
            .mobile-only { display: flex !important; } /* Show on Mobile */
            .desktop-only { display: none !important; } /* Hide on Mobile */
 body {
                overflow-y: auto; /* Allow scrolling vertically on small phones */
                overflow-x: hidden; /* Prevent horizontal scroll */
            }

            /* 1. Header: Logos side to side, small padding */
            .logo-header {
                flex-wrap: nowrap; /* Force single line */
                justify-content: space-between; /* Stretch from side to side */
                padding: 15px 10px; /* Small padding so it doesn't touch the side */
                gap: 0; 
                width: 100%;
                box-sizing: border-box;
                overflow-x: hidden; 
            }

            /* Use vw units so logos shrink as screen gets narrower */
            .logo-item, .logo-b, .logo-s, .logo-y { height: 8vw; width: auto; }
            .separator { height: 5vw; width: auto; }

            /* 2. Layout: Stack vertically, aligned left */
            .hero-container {
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-start; /* Start from left */
                padding: 20px; /* Equal padding right and left */
                height: auto;
            }

            .content-box {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: flex-start; /* Left align text and buttons */
                margin-top: 10px;
            }

            /* 3. Text: Left aligned, Single Line, Resizes with screen */
            .headline {
                transform: none !important; /* Reset position */
                white-space: nowrap; /* Force single line */
                text-align: left;
                font-size: 6.7vw; /* Reduced from 7vw to fit with max-width */
                margin-bottom: 10px;
                width: 100%;
                max-width: 85%; /* Don't touch right side */
            }

            .divider {
                transform: none !important;
                margin: 10px 0; /* Align left */
            }

            .subtext {
                transform: none !important;
                text-align: left;
                font-size: 1.1rem;
                margin-bottom: 30px;
                max-width: 90%; /* Constrain text width so it doesn't touch the right edge */
            }

           @media (max-width: 1024px) {
    .mobile-only .btn-group-row {
        display: grid !important;
        grid-template-columns: 1fr 1fr 1fr !important; /* 3 invisible tracks */
        width: 100vw;
        box-sizing: border-box;
        padding: 10px 5%; /* Adjust this to move buttons closer/further from edge */
        gap: 0;
        transform: none !important; /* Remove desktop shifts */
         padding-left: 0;
  padding-right: 7%;
    }

    .mobile-only .image-btn-base {
        width: 42vw;
        max-width: 150px;
        transform: none !important; /* Remove desktop shifts */
    }

    /* Column Placement */
    .btn-left { grid-column: 1; justify-self: start; }
    .btn-center { grid-column: 2; justify-self: center; }
    .btn-right { grid-column: 3; justify-self: end; }

    /* Label fix for mobile */
    .btn-label {
        font-size: clamp(0.8rem, 3vw, 1.1rem) !important;
        width: 100%;
        text-align: center;
    }
}

            .p1-hero { top: 20px; right: -30%; height: 50vh; opacity: 0.2; z-index: -1; }
        }
    </style>
</head>
<body>

    <!-- Header with Logos and bet.webp separators -->
    <header class="logo-header">
        <img src="caf.webp" alt="caf" class="logo-item">
        <img src="bet.webp" alt="" class="separator"> 
        <img src="cmc.webp" alt="cmc" class="logo-s">
        <img src="bet.webp" alt="" class="separator">
        <img src="dia.webp" alt="dia" class="logo-item">
        <img src="bet.webp" alt="" class="separator">
        <img src="AIG.webp" alt="AIG" class="logo-item">
        <img src="bet.webp" alt="" class="separator">
        <img src="arti.webp" alt="arti" class="logo-item">
        <img src="bet.webp" alt="" class="separator">
        <img src="fablab.webp" alt="fablab" class="logo-b">
        <img src="bet.webp" alt="" class="separator">
        <img src="y.webp" alt="y" class="logo-y">
    </header>

    <main class="hero-container">
        <!-- The big image on the max right -->
        <img src="p1.webp" alt="" class="p1-hero">

        <div class="content-box fade-in">
            <h1 class="headline">
                Live the AFCON Experience
            </h1>
            
            <div class="divider"></div>
            
            <p class="subtext">
                Celebrate the heartbeat of African football.
Interactive games, brainstormed in the FabLab and CoP at CMC BMK, highlight our institute’s
dedication to the spectacle our country knows.
            </p>

          <!-- DESKTOP VERSION -->
            <div class="desktop-only">
                <div class="btn-group-row row-top">
                    <button class="image-btn-base" onclick="window.location.href='predict/predict.html'">
                        <img src="btn.webp" alt="" style="width: 100%;">
                        <span class="btn-label">Predict</span>
                    </button>
                    <button class="image-btn-base" onclick="window.location.href='quiz/quiz.html'">
                        <img src="btn.webp" alt="" style="width: 100%;">
                        <span class="btn-label">Quiz</span>
                    </button class="btn-group-row row-center">
                    <button class="image-btn-base" onclick="openVideo()">
                        <img src="btn.webp" alt="" style="width: 100%;">
                        <span class="btn-label">Video</span>
                    </button>
                </div>
                <div class="btn-group-row row-bottom ">
                    <button class="image-btn-base" onclick="document.getElementById('card-section').scrollIntoView({behavior: 'smooth'})">
                        <img src="btn.webp" alt="" style="width: 100%;">
                        <span class="btn-label">Card</span>
                    </button>
                    <button class="image-btn-base" onclick="window.location.href='memo/memo.html'">
                        <img src="btn.webp" alt="" style="width: 100%;">
                        <span class="btn-label">Memo</span>
                    </button>
                </div>
            </div>

            <!-- MOBILE VERSION -->
          <div class="mobile-only" style="display: flex; flex-direction: column; width: 100%;">
    <div class="btn-group-row">
        <button class="image-btn-base btn-left" onclick="window.location.href='memo/memo.html'">
            <img src="btn.webp" style="width: 100%;">
            <span class="btn-label">Memo</span>
        </button>
        <button class="image-btn-base btn-right" onclick="window.location.href='quiz/quiz.html'">
            <img src="btn.webp" style="width: 100%;">
            <span class="btn-label">Quiz</span>
        </button>
    </div>

    <div class="btn-group-row">
        <button class="image-btn-base btn-center" onclick="window.location.href='predict/predict.html'">
            <img src="btn.webp" style="width: 100%;">
            <span class="btn-label">Predict</span>
        </button>
    </div>

    <div class="btn-group-row">
        <button class="image-btn-base btn-left" onclick="document.getElementById('card-section').scrollIntoView({behavior: 'smooth'})">
            <img src="btn.webp" style="width: 100%;">
            <span class="btn-label">Card</span>
        </button>
        <button class="image-btn-base btn-right" onclick="openVideo()">
            <img src="btn.webp" style="width: 100%;">
            <span class="btn-label">Video</span>
        </button>
    </div>
</div>

        
    </main>
      <div id="video-modal" onclick="closeVideo()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeVideo()">&times;</span>
            <video id="afcon-video" controls playsinline>
                <source src="vid.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        function openVideo() {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('afcon-video');
            modal.style.display = 'flex';
            video.play();
        }

        function closeVideo() {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('afcon-video');
            modal.style.display = 'none';
            video.pause();
            video.currentTime = 0;
        }
    </script>

</body>
</html>
