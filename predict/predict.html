<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction</title>
     <link rel="icon" type="image/png" href="./favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Chargement des polices personnalisées */
        @font-face {
            font-family: 'AFCON';
            src: url('LIVE.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'sald';
            src: url('sald.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #801416;
            background-image: url('a.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            margin: 0;
            font-family: 'AFCON', sans-serif;
            overflow-x: hidden;
        }

        /* Styles de la Bannière Épurée intégrés */
        .custom-rectangle {
            width: 850px;
            height: 97px;
            background-color: #620100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: visible; 
            position: relative;
            border: none;
        }
        
        .side-image-left {
            height: 99px; 
            width: auto;
            object-fit: contain;
            display: block;
            z-index: 10;
            transform: translateX(-70%);
            flex-shrink: 0;
            /* Ajout de l'effet d'ombre */
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
        }

        .side-image-right {
            height: 99px;
            width: auto;
            object-fit: contain;
            display: block;
            z-index: 10;
            transform: translateX(70%);
            flex-shrink: 0;
            /* Ajout de l'effet d'ombre */
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
        }

        .center-image {
            height: 75%;
            width: auto;
            object-fit: contain;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            /* Ajout de l'effet d'ombre */
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.4));
        }

        .number-text {
            font-family: 'sald', sans-serif;
            position: absolute;
            top: 0; 
            height: 100%; 
            width: 65px; 
            background-color: white; 
            color: #620100; 
            font-weight: 900;
            font-size: 70px;
            z-index: 6;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            left: 50%;
            transform: translateX(-50%);
            padding-top: 11px;
        }

        .number-left { margin-left: -65px; }
        .number-right { margin-left: 65px; }

        .country-label {
            position: absolute;
            top: 50%;
            color: white;
            font-family: 'AFCON', sans-serif;
            font-size: 37px;
            letter-spacing: 1px;
            z-index: 4;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .label-morocco { margin-left: -230px; }
        .label-senegal { margin-left: 230px; }

        /* Styles spécifiques au Dashboard */
        .mascot-container {
            position: fixed;
            bottom: 5px;
            right: 10px;
            width: 220px;
            z-index: 9999; 
            pointer-events: none; 
        }

        .mascot-container img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 2rem;
            border-radius: 8px;
            z-index: 10000;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .home-btn {
            width: 80px;
            transition: transform 0.3s, filter 0.3s;
        }
        .home-btn:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 8px #00ffff) drop-shadow(0 0 15px #ff00ff);
        }

        .placeholder-box {
            background-color: rgba(0,0,0,0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <a href="../index.html" style="position: fixed; bottom: 140px; left: 120px; z-index: 1000;">
        <img src="HOME.webp" alt="Home" class="home-btn">
    </a>

    <div id="notification" class="bg-yellow-500 text-black font-bold shadow-2xl"></div>

    <header class="w-full flex justify-center items-center py-4 bg-transparent">
        <img src="b.webp" alt="Header Logos" style="width: 40%;" class="h-auto block">
    </header>

    <main class="max-w-6xl mx-auto p-6 relative mt-[-40px]">
        
        <!-- Score Section (Symmetric Banner Integrated) -->
        <div class="flex justify-center mb-10">
            <div class="custom-rectangle rounded-sm">
                <!-- Image Gauche (Maroc) -->
                <img src="mar.webp" alt="mar.webp" class="side-image-left"
                    onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('afterbegin', '<div class=\'side-image-left h-full w-[150px] placeholder-box\'>mar.webp</div>')">
                
                <!-- Texte Maroc -->
                <span class="country-label label-morocco">Morocco</span>

                <!-- Pilier 0 -->
                <span class="number-text number-left" id="avgA">0</span>

                <!-- Image Centre -->
                <img src="cafi.webp" alt="cafi.webp" class="center-image"
                    onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('beforeend', '<div class=\'center-image h-[80%] w-[40px] placeholder-box\'>cafi</div>')">

                <!-- Pilier 1 -->
                <span class="number-text number-right" id="avgB">0</span>

                <!-- Texte Sénégal -->
                <span class="country-label label-senegal">Senegal</span>

                <!-- Image Droite (Sénégal) -->
                <img src="sngl.webp" alt="sngl.webp" class="side-image-right"
                    onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('beforeend', '<div class=\'side-image-right h-full w-[150px] placeholder-box\'>sngl.webp</div>')">
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-8 relative z-20">
            <section class="bg-red-900/30 p-8 rounded-2xl border border-white/10 backdrop-blur-md">
                <h2 class="text-2xl font-bold mb-6 text-yellow-500">Enter Your Pronostic</h2>
                <div class="space-y-4">
                    <input type="text" id="userName" placeholder="Your Name" 
                           class="w-full p-3 rounded bg-black/50 border border-red-900 focus:border-yellow-500 focus:outline-none transition-colors">
                    
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-xs mb-1 text-gray-400 uppercase font-bold">MAR Score</label>
                            <input type="number" id="scoreA" class="w-full p-3 rounded bg-black/50 border border-red-900 focus:border-yellow-500 outline-none" value="0" min="0">
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs mb-1 text-gray-400 uppercase font-bold">SEN Score</label>
                            <input type="number" id="scoreB" class="w-full p-3 rounded bg-black/50 border border-red-900 focus:border-yellow-500 outline-none" value="0" min="0">
                        </div>
                    </div>

                    <button onclick="addPrediction()" class="w-full py-4 bg-[#d48c00] hover:bg-yellow-500 text-black font-black rounded-lg transition-all uppercase mt-4 shadow-lg active:scale-95">
                        Submit Prediction
                    </button>
                </div>
            </section>

            <section class="bg-black/40 p-6 rounded-2xl border border-white/10 backdrop-blur-sm">
                <h2 class="text-xl font-bold mb-4 text-yellow-500">Who is Near to Win?</h2>
                <canvas id="accuracyChart" height="200"></canvas>
            </section>
        </div>

        <section class="mt-12 mb-20">
            <h2 class="text-2xl font-bold mb-6 text-center text-white/90">Current Leaderboard</h2>
            <div id="leaderboard" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            </div>
        </section>

    </main>

    <div class="mascot-container">
        <img src="c.webp" alt="Mascot" onerror="this.style.display='none'">
    </div>

    <script>
    const predictions = [];
    let currentAverageA = 0;
    let currentAverageB = 0;

    const ctx = document.getElementById('accuracyChart').getContext('2d');
    const accuracyChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Start', '15\'', '30\'', '45\'', 'Now'],
            datasets: []
        },
        options: {
            responsive: true,
            scales: { 
                y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#888' } },
                x: { grid: { display: false }, ticks: { color: '#888' } }
            },
            plugins: { legend: { labels: { color: 'white', font: { size: 10 } } } }
        }
    });

    function showToast(msg) {
        const toast = document.getElementById('notification');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function calculateAccuracy(predA, predB) {
        const diff = Math.abs(predA - currentAverageA) + Math.abs(predB - currentAverageB);
        return Math.max(0, 100 - (diff * 20));
    }

    function addPrediction() {
        const nameInput = document.getElementById('userName');
        const name = nameInput.value.trim();
        const sA = parseInt(document.getElementById('scoreA').value) || 0;
        const sB = parseInt(document.getElementById('scoreB').value) || 0;

        if (!name) return showToast("Please enter your name!");
        predictions.push({ name, sA, sB, accuracy: 0 });
        updateAverages();
        nameInput.value = ''; 
        showToast(`Prediction added!`);
    }

    function updateAverages() {
        const count = predictions.length;
        const avgAElem = document.getElementById('avgA');
        const avgBElem = document.getElementById('avgB');

        if (count > 0) {
            const sumA = predictions.reduce((sum, p) => sum + p.sA, 0);
            const sumB = predictions.reduce((sum, p) => sum + p.sB, 0);
            currentAverageA = Math.round(sumA / count);
            currentAverageB = Math.round(sumB / count);
            avgAElem.innerText = currentAverageA;
            avgBElem.innerText = currentAverageB;
        }

        updateLeaderboardUI();
        const last = predictions[predictions.length - 1];
        if (last) {
            updateChart(last.name, calculateAccuracy(last.sA, last.sB));
        }
    }

    function updateLeaderboardUI() {
        const container = document.getElementById('leaderboard');
        container.innerHTML = ''; 
        predictions.forEach(p => { p.accuracy = calculateAccuracy(p.sA, p.sB); });
        const sorted = [...predictions].sort((a, b) => b.accuracy - a.accuracy);
        sorted.forEach(p => {
            const card = document.createElement('div');
            card.className = "bg-green-900/80 p-4 rounded-xl border-t-4 border-yellow-500 text-center shadow-xl backdrop-blur-sm transform transition hover:scale-105";      
            card.innerHTML = `
                <div class="text-xs font-bold text-yellow-500 uppercase truncate px-2">${p.name}</div>
                <div class="text-2xl font-black">${p.sA} - ${p.sB}</div>
                <div class="text-[10px] text-gray-300 mt-1">${p.accuracy}% Match</div>
            `;
            container.appendChild(card);
        });
    }

    function updateChart(name, acc) {
        const color = `hsl(${Math.random() * 360}, 70%, 60%)`;
        accuracyChart.data.datasets.push({
            label: name,
            data: [40, 55, 45, 60, acc],
            borderColor: color,
            backgroundColor: color,
            tension: 0.4,
            borderWidth: 2,
            pointRadius: 3
        });
        accuracyChart.update();
    }
</script>
</body>
</html>
