<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    
    <!-- Preload critical background images -->
    <link rel="preload" as="image" href="a.webp">
    
    <!-- Defer heavy scripts so they don't block page rendering -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

    <style>
        @font-face {
            font-family: 'AFCON';
            src: url('LIVE.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; /* Fixes blank text during load */
        }
        @font-face {
            font-family: 'sald';
            src: url('sald.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            background: #801416 url('a.webp') no-repeat center center fixed;
            background-size: cover;
            color: white;
            margin: 0;
            font-family: 'AFCON', sans-serif;
            overflow-x: hidden;
        }

        @media (max-width: 768px) {
            body { background-image: url('z.webp'); }
        }

        /* Optimized Transitions: 0.9s was too slow, 0.3s is snappy */
        .side-image-left, .side-image-right, .home-btn, .team-option {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .custom-rectangle {
            width: 850px;
            height: 97px;
            background-color: #620100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        
        .side-image-left { transform: translateX(-70%); z-index: 10; height: 99px; }
        .side-image-right { transform: translateX(70%); z-index: 10; height: 99px; }

        .side-image-left:hover { transform: translateX(-70%) scale(1.1); filter: brightness(1.2); }
        .side-image-right:hover { transform: translateX(70%) scale(1.1); filter: brightness(1.2); }

        .center-image {
            height: 75%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .number-text {
            font-family: 'sald', sans-serif;
            position: absolute;
            top: 0; height: 100%; width: 65px;
            background-color: white; color: #620100;
            font-weight: 900; font-size: 70px;
            display: flex; align-items: center; justify-content: center;
            left: 50%; transform: translateX(-50%);
            padding-top: 11px; z-index: 6;
        }

        .number-left { margin-left: -65px; }
        .number-right { margin-left: 65px; }

        .country-label {
            position: absolute; top: 50%; color: white;
            font-size: 37px; z-index: 4; text-transform: uppercase;
            left: 50%; transform: translate(-50%, -50%);
        }

        .label-morocco { margin-left: -230px; }
        .label-senegal { margin-left: 230px; }

        .mascot-container {
            position: fixed; bottom: 5px; right: 10px;
            width: 220px; z-index: 9999; pointer-events: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .custom-rectangle { width: 85vw; height: 60px; margin-top: 20px; }
            .side-image-left, .side-image-right { height: 65px; }
            .number-text { width: 45px; font-size: 40px; }
            .number-left { margin-left: -45px; }
            .number-right { margin-left: 45px; }
            .country-label { font-size: 16px; }
            .label-morocco { margin-left: -110px; }
            .label-senegal { margin-left: 110px; }
            .mascot-container { width: 100px; }
        }
    </style>
</head>
<body>
    <a id="homeLink" href="../index.html" style="position: fixed; bottom: 40px; left: 40px; z-index: 1000;">
        <img src="HOME.webp" alt="Home" class="home-btn w-16">
    </a>

    <!-- Notification Toast -->
    <div id="notification" class="fixed top-5 right-5 bg-yellow-500 text-black p-4 rounded-lg font-bold shadow-xl hidden z-[10000]"></div>

    <!-- Team Modal -->
    <div id="teamModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[10001]" onclick="closeModal()">
        <div class="bg-[#620100] p-8 rounded-2xl border border-yellow-500/50 max-w-lg w-full mx-4" onclick="event.stopPropagation()">
            <h2 class="text-2xl font-bold mb-6 text-center text-yellow-500">CHOOSE A TEAM</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="team-option p-4 rounded-xl text-center border border-transparent hover:border-yellow-500 hover:bg-white/10" onclick="selectTeam('MOR')">
                    <img src="mar.webp" alt="Morocco" class="h-16 mx-auto mb-2 object-contain">
                    <p class="font-bold">MOROCCO</p>
                </div>
                <div class="team-option p-4 rounded-xl text-center border border-transparent hover:border-yellow-500 hover:bg-white/10" onclick="selectTeam('SEN')">
                    <img src="sngl.webp" alt="Senegal" class="h-16 mx-auto mb-2 object-contain">
                    <p class="font-bold">SENEGAL</p>
                </div>
            </div>
        </div>
    </div>

    <header class="w-full flex justify-center py-6">
        <img src="b.webp" alt="Header" class="w-1/2 md:w-1/3">
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <!-- Scoreboard -->
        <div class="flex justify-center mb-12">
            <div class="custom-rectangle">
                <img id="flagA" src="mar.webp" alt="Team A" class="side-image-left" onclick="openModal('A')">
                <span id="nameA" class="country-label label-morocco">Morocco</span>
                <span class="number-text number-left" id="avgA">0</span>
                <img src="cafi.webp" alt="Trophy" class="center-image">
                <span class="number-text number-right" id="avgB">0</span>
                <span id="nameB" class="country-label label-senegal">Senegal</span>
                <img id="flagB" src="sngl.webp" alt="Team B" class="side-image-right" onclick="openModal('B')">
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Form -->
            <section class="bg-red-900/20 p-8 rounded-2xl border border-white/10 backdrop-blur-md">
                <h2 class="text-2xl font-bold mb-6 text-yellow-500">Enter Your Pronostic</h2>
                <div class="space-y-4">
                    <input type="text" id="userName" placeholder="Your Name" class="w-full p-3 rounded bg-black/50 border border-white/10 outline-none focus:border-yellow-500">
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label id="labelA" class="text-xs text-gray-400 font-bold uppercase">MOR Score</label>
                            <input type="number" id="scoreA" class="w-full p-3 rounded bg-black/50 border border-white/10" value="0">
                        </div>
                        <div class="flex-1">
                            <label id="labelB" class="text-xs text-gray-400 font-bold uppercase">SEN Score</label>
                            <input type="number" id="scoreB" class="w-full p-3 rounded bg-black/50 border border-white/10" value="0">
                        </div>
                    </div>
                    <button onclick="addPrediction()" class="w-full py-4 bg-yellow-600 hover:bg-yellow-500 text-black font-black rounded-lg uppercase shadow-lg transition-transform active:scale-95">
                        Submit Prediction
                    </button>
                </div>
            </section>

            <!-- Chart -->
            <section class="bg-black/30 p-6 rounded-2xl border border-white/10">
                <h2 class="text-xl font-bold mb-4 text-yellow-500">Who is Near to Win?</h2>
                <canvas id="accuracyChart" height="200"></canvas>
            </section>
        </div>

        <!-- Leaderboard -->
        <section class="mt-12 mb-20">
            <h2 class="text-2xl font-bold mb-6 text-center">Current Leaderboard</h2>
            <div id="leaderboard" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>
    </main>

    <div class="mascot-container">
        <img src="c.webp" alt="Mascot">
    </div>

    <script>
        const predictions = [];
        let targetSide = 'A';
        let chartInstance = null;

        const teamData = {
            'MOR': { name: 'Morocco', img: 'mar.webp', code: 'MOR' },
            'SEN': { name: 'Senegal', img: 'sngl.webp', code: 'SEN' }
        };

        function showToast(msg) {
            const t = document.getElementById('notification');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function openModal(side) {
            targetSide = side;
            document.getElementById('teamModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('teamModal').style.display = 'none';
        }

        function selectTeam(code) {
            const team = teamData[code];
            if (targetSide === 'A') {
                document.getElementById('flagA').src = team.img;
                document.getElementById('nameA').innerText = team.name;
                document.getElementById('labelA').innerText = `${team.code} Score`;
            } else {
                document.getElementById('flagB').src = team.img;
                document.getElementById('nameB').innerText = team.name;
                document.getElementById('labelB').innerText = `${team.code} Score`;
            }
            closeModal();
            showToast("Team Updated");
        }

        window.onload = () => {
            const ctx = document.getElementById('accuracyChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: ['Start', '15\'', '30\'', '45\'', 'Now'], datasets: [] },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        };

        function addPrediction() {
            const name = document.getElementById('userName').value.trim();
            const sA = parseInt(document.getElementById('scoreA').value);
            const sB = parseInt(document.getElementById('scoreB').value);

            if (!name) return showToast("Enter your name!");
            
            predictions.push({ name, sA, sB, accuracy: Math.floor(Math.random() * 40) + 60 });
            updateUI();
            document.getElementById('userName').value = '';
        }

        function updateUI() {
            const lb = document.getElementById('leaderboard');
            lb.innerHTML = predictions.map(p => `
                <div class="bg-green-900/40 p-4 rounded-xl border-t-2 border-yellow-500 text-center">
                    <div class="text-xs font-bold text-yellow-500 truncate">${p.name}</div>
                    <div class="text-xl font-black">${p.sA} - ${p.sB}</div>
                    <div class="text-[10px] text-gray-400">${p.accuracy}% Match</div>
                </div>
            `).join('');

            // Update score averages visually
            const avgA = Math.round(predictions.reduce((a, b) => a + b.sA, 0) / predictions.length);
            const avgB = Math.round(predictions.reduce((a, b) => a + b.sB, 0) / predictions.length);
            document.getElementById('avgA').innerText = avgA;
            document.getElementById('avgB').innerText = avgB;
        }
    </script>
</body>
</html>
